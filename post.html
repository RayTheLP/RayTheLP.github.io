<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... - raythelp's Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="headerContainer"></div>

    <main class="main-content post-layout">
        <div class="post-container" id="postContent">
            <div class="loading">正在載入文章...</div>
        </div>
        <div class="post-navigation" id="postNavigation"></div>
    </main>

    <div id="footerContainer"></div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/interactive.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const postId = urlParams.get('id');

                if (!postId) {
                    document.getElementById('postContent').innerHTML = '<div class="loading error">找不到文章</div>';
                    document.title = "找不到文章 - raythelp's Blog";
                    return;
                }
                loadPost(postId);
            }, 200);
        });

        async function loadPost(postId) {
            try {
                const response = await fetch('posts.json');
                const data = await response.json();
                const post = data.posts.find(p => p.id === postId);

                if (!post) {
                    document.getElementById('postContent').innerHTML = '<div class="loading error">找不到文章</div>';
                    document.title = "找不到文章 - raythelp's Blog";
                    return;
                }

                // 從 .md 檔案載入文章內容
                const filePath = post.file || `posts/${post.id}.md`;
                const { content } = await window.markdownUtils.fetchPost(filePath);
                post.content = content;

                document.title = `${post.title} - raythelp's Blog`;
                renderPost(post);
                generateNavigation(data.posts, postId);
            } catch (error) {
                console.error('載入文章時發生錯誤:', error);
                document.getElementById('postContent').innerHTML = '<div class="loading error">載入文章失敗</div>';
            }
        }

        function renderPost(post) {
            const container = document.getElementById('postContent');
            const contentHtml = window.markdownConverter.convert(post.content);
            const wordCount = Analytics.countWords(post.content);
            const readingTime = Math.ceil(wordCount / SITE_CONFIG.posts.readingSpeed);

            container.innerHTML = `
                <div class="post-hero">
                    <div class="post-meta-line">
                        <span class="post-category-badge"><i class="fas fa-folder"></i> ${post.category || '未分類'}</span>
                        <span class="post-date-text">${post.date}</span>
                    </div>
                    <h1 class="post-title">${post.title}</h1>
                    <div class="post-info">
                        <span>${wordCount} 字</span>
                        <span class="separator"></span>
                        <span>${readingTime} 分鐘閱讀</span>
                        <span class="separator"></span>
                        <span class="view-count" data-page-id="post_${post.id}">${Analytics.getPageViews('post_' + post.id)} 次瀏覽</span>
                    </div>
                    <div class="post-tags-line">
                        ${post.tags ? post.tags.map(tag => `<span class="tag">${tag}</span>`).join('') : ''}
                    </div>
                </div>
                <div class="post-body">
                    ${contentHtml}
                </div>
            `;

            if (window.InteractiveElements) {
                InteractiveElements.initialized = false;
                setTimeout(() => { InteractiveElements.init(); }, 100);
            }

            // 如果是美食文章，插入數據視覺化
            if (post.id === 'food_blog' && window.Charts) {
                const vizContainer = document.createElement('div');
                vizContainer.id = 'foodVizSection';
                const postHero = container.querySelector('.post-hero');
                const postBody = container.querySelector('.post-body');
                if (postHero && postBody) {
                    postBody.parentNode.insertBefore(vizContainer, postBody);
                    Charts.renderFoodCharts('foodVizSection', post.content);
                }
            }

            // 生成浮動目錄 TOC
            buildFloatingTOC(container.querySelector('.post-body'));
        }

        function buildFloatingTOC(postBody) {
            if (!postBody) return;
            const headings = postBody.querySelectorAll('h2, h3');
            if (headings.length < 3) return; // 太少標題不需要 TOC

            // 為每個標題加上 id
            headings.forEach((h, i) => {
                if (!h.id) h.id = 'heading-' + i;
            });

            const tocHTML = `
                <div class="post-toc-title">目錄</div>
                <ul class="post-toc-list">
                    ${Array.from(headings).map(h => `
                        <li><a href="#${h.id}" class="${h.tagName === 'H3' ? 'toc-h3' : ''}">${h.textContent}</a></li>
                    `).join('')}
                </ul>
            `;

            const toc = document.createElement('nav');
            toc.className = 'post-toc';
            toc.innerHTML = tocHTML;
            document.body.appendChild(toc);

            // 延遲顯示 TOC
            setTimeout(() => toc.classList.add('visible'), 400);

            // 高亮當前閱讀區段
            const tocLinks = toc.querySelectorAll('.post-toc-list a');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        tocLinks.forEach(l => l.classList.remove('active'));
                        const link = toc.querySelector(`a[href="#${entry.target.id}"]`);
                        if (link) link.classList.add('active');
                    }
                });
            }, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });

            headings.forEach(h => observer.observe(h));
        }

        function generateNavigation(posts, currentId) {
            const navContainer = document.getElementById('postNavigation');
            if (!navContainer) return;

            const currentIndex = posts.findIndex(p => p.id === currentId);
            let navHTML = '';

            if (currentIndex < posts.length - 1) {
                const prevPost = posts[currentIndex + 1];
                navHTML += `
                    <a href="post.html?id=${prevPost.id}" class="nav-button prev">
                        <span class="nav-button-icon"><i class="fas fa-chevron-left"></i></span>
                        <div class="nav-button-content">
                            <div class="nav-button-label">上一篇</div>
                            <div class="nav-button-title">${prevPost.title}</div>
                        </div>
                    </a>`;
            } else {
                navHTML += '<div class="nav-spacer"></div>';
            }

            if (currentIndex > 0) {
                const nextPost = posts[currentIndex - 1];
                navHTML += `
                    <a href="post.html?id=${nextPost.id}" class="nav-button next">
                        <span class="nav-button-icon"><i class="fas fa-chevron-right"></i></span>
                        <div class="nav-button-content">
                            <div class="nav-button-label">下一篇</div>
                            <div class="nav-button-title">${nextPost.title}</div>
                        </div>
                    </a>`;
            } else {
                navHTML += '<div class="nav-spacer"></div>';
            }

            navContainer.innerHTML = navHTML;
        }
    </script>
</body>
</html>
