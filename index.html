<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>raythelp's Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="headerContainer"></div>

    <main class="main-content">
        <section class="hero">
            <div class="hero-eyebrow"><i class="fas fa-sparkles"></i> 個人技術部落格</div>
            <h1 class="hero-title">raythelp's Blog</h1>
            <p class="hero-subtitle">一個平凡大學生的技術筆記與生活紀錄，分享美食、程式、心得</p>
            <div class="hero-cta">
                <a href="#postsContainer" class="hero-cta-btn primary"><i class="fas fa-book-open"></i> 開始閱讀</a>
                <a href="about.html" class="hero-cta-btn secondary"><i class="fas fa-user"></i> 關於我</a>
            </div>
        </section>

        <section class="stats-dashboard reveal" id="statsDashboard"></section>

        <div class="content-grid">
            <section class="content">
                <div class="section-heading reveal">
                    <span class="section-heading-badge"><i class="fas fa-clock"></i> Latest Posts</span>
                    <span class="section-heading-line"></span>
                </div>
                <div class="posts-container" id="postsContainer"></div>
                <div class="pagination" id="pagination"></div>
            </section>
            <div id="sidebarContainer"></div>
        </div>
    </main>

    <div id="footerContainer"></div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/main.js"></script>
    <script src="js/interactive.js"></script>
    <script src="js/analytics.js"></script>
</body>
</html>
